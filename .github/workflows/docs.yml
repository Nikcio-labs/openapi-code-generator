name: Deploy Docs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Match the Build workflow: keep NuGet out of the runner image's
      # pre-seeded ~/.nuget cache, which restore fails against silently
      # (MSB4181 with no logged error).
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      # Restore and publish as direct steps: when dotnet runs as a node/pnpm
      # child process on the runner, NuGet restore fails silently (MSB4181
      # with no logged error), so build-wasm.mjs only copies the output and
      # smoke-tests it in CI (--skip-publish).
      - name: Restore .NET dependencies
        run: dotnet restore src/OpenApiCodeGenerator.Wasm

      - name: Publish WebAssembly playground runtime
        run: dotnet publish src/OpenApiCodeGenerator.Wasm -c Release

      - name: Install, build, and upload your site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: docs
          node-version: 24
          package-manager: pnpm@latest
          build-cmd: pnpm run build:ci

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
