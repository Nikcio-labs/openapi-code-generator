name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benchmarks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - 'OpenApiCodeGenerator.slnx'
      - 'nuget.config'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'docs/package.json'
      - '.github/workflows/build.yml'
      - '.release-please-config.json'
      - '.release-please-manifest.json'
      - '.commitlintrc.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'docs/package.json'
      - 'docs/src/**'
      - 'docs/astro.config.mjs'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: ./

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./

  aot:
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT)
        run: dotnet publish src/OpenApiCodeGenerator.Cli -c Release -r linux-x64
        working-directory: ./

      - name: Smoke test AOT binary
        run: |
          src/OpenApiCodeGenerator.Cli/bin/Release/net10.0/linux-x64/publish/OpenApiCodeGen --version
          src/OpenApiCodeGenerator.Cli/bin/Release/net10.0/linux-x64/publish/OpenApiCodeGen tests/OpenApiCodeGenerator.Tests/Fixtures/aot-smoke-test.yaml -o /tmp/aot-smoke.cs
          grep -q "JsonStringEnumMemberName(\"available\")" /tmp/aot-smoke.cs
        working-directory: ./

  npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: ./docs

      - name: Lint
        run: pnpm lint
        working-directory: ./docs
