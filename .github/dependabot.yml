version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-nuget)"
    groups:
      openapi:
        patterns:
          - "Microsoft.OpenApi"
          - "Microsoft.OpenApi.YamlReader"
      testing:
        patterns:
          - "xunit.v3"
          - "xunit.runner.visualstudio"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      biome:
        patterns:
          - "@biomejs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-ci)"
    groups:
      actions:
        patterns:
          - "*"
