openapi: 3.0.3
info:
  title: AOT Test API
  version: 1.0.0
paths:
  /pets:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold]
    PetId:
      type: integer
      format: int64
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id:
          $ref: '#/components/schemas/PetId'
        name:
          type: string
          maxLength: 100
          minLength: 1
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          $ref: '#/components/schemas/PetStatus'
        metadata:
          type: object
          additionalProperties:
            type: string
    LegacyPet:
      deprecated: true
      type: object
      properties:
        name:
          type: string
